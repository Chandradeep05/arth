name: Alert Evaluator

on:
  schedule:
    # Every 5 minutes, 24/7. The backend market calendar automatically skips
    # evaluation when all target exchanges are closed.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: alert-evaluator
  cancel-in-progress: false

jobs:
  evaluate-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate price alerts
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$INTERNAL_JOB_SECRET" ]; then
            echo "::error::BACKEND_URL or INTERNAL_JOB_SECRET secret is not set in GitHub repo secrets"
            exit 1
          fi
          BASE="${BACKEND_URL%/}"

          # Wake backend first (Render cold start)
          curl -s -o /dev/null --max-time 90 "$BASE/health" || true

          http_code=$(curl -s -o body.json -w "%{http_code}" --max-time 120 \
            -X POST \
            -H "X-Internal-Secret: $INTERNAL_JOB_SECRET" \
            -H "Content-Type: application/json" \
            "$BASE/api/v1/internal/jobs/evaluate-alerts" || echo "000")

          echo "HTTP status: $http_code"
          echo "Response body:"
          cat body.json 2>/dev/null || true
          echo

          if [ "$http_code" = "000" ]; then
            echo "::error::Network error -- backend unreachable"
            exit 1
          fi
          if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
            echo "::error::Auth rejected -- INTERNAL_JOB_SECRET in GitHub does not match Render env var"
            exit 1
          fi
          if [ "$http_code" != "200" ]; then
            echo "::error::Unexpected status $http_code"
            exit 1
          fi

          # Strict semantic JSON validation & structured markdown summary
          python3 -c "
          import json, os, sys
          try:
              with open('body.json') as f:
                  content = f.read().strip()
              if not content:
                  print('::error::Empty response body received from evaluate-alerts')
                  sys.exit(1)
              d = json.loads(content)
              if not isinstance(d, dict):
                  print('::error::Expected JSON object in response, got ' + type(d).__name__)
                  sys.exit(1)

              if d.get('status') == 'error' or 'error' in d:
                  print(f'::error::Alert evaluation failed on backend: {d.get(\"error\") or d.get(\"reason\")}')
                  sys.exit(1)

              if d.get('skipped') is True:
                  ALLOWED_SKIPS = {
                      'Evaluated recently within 120s cooldown',
                      'Another evaluation running',
                      'Another evaluation running (in-process)',
                  }
                  reason = d.get('reason')
                  if reason not in ALLOWED_SKIPS:
                      print(f'::error::Unrecognized or illegal alert evaluation skip reason: {reason!r}')
                      sys.exit(1)
                  summary = f'''### ⏸️ Alert Evaluation Skipped
          - **Reason:** \`{reason}\`
          - **HTTP Status:** \`$http_code\`
          '''
              elif 'skipped' in d and d.get('skipped') is not False:
                  print(f'::error::Invalid skipped value in alert evaluation response: {d.get(\"skipped\")!r}')
                  sys.exit(1)
              else:
                  # Validate all required completion fields and types
                  if not d.get('run_id') or not isinstance(d['run_id'], str):
                      print('::error::Missing or invalid run_id in alert evaluation response')
                      sys.exit(1)
                  if not d.get('at') or not isinstance(d['at'], str):
                      print('::error::Missing or invalid at timestamp in alert evaluation response')
                      sys.exit(1)

                  required_metrics = [
                      'active_alerts', 'symbols_requested', 'quotes_obtained',
                      'evaluated', 'triggered', 'notifications_created',
                      'skipped_market_closed', 'provider_errors'
                  ]
                  for metric in required_metrics:
                      val = d.get(metric)
                      if val is None or not isinstance(val, int) or isinstance(val, bool) or val < 0:
                          print(f'::error::Invalid alert metric {metric}: expected non-negative integer, got {val!r}')
                          sys.exit(1)

                  if not isinstance(d.get('unpriced_symbols'), list):
                      print(f'::error::Invalid unpriced_symbols: expected list, got {type(d.get(\"unpriced_symbols\")).__name__}')
                      sys.exit(1)

                  dur = d.get('duration_ms')
                  if dur is None or not isinstance(dur, (int, float)) or dur < 0:
                      print(f'::error::Invalid duration_ms: expected non-negative number, got {dur!r}')
                      sys.exit(1)

                  summary = f'''### 📊 Alert Evaluation Evidence (Run: {d.get(\"run_id\", \"N/A\")})
          | Metric | Value |
          |---|---|
          | **Execution Timestamp** | \`{d.get(\"at\", \"N/A\")}\` |
          | **HTTP Status** | \`$http_code\` |
          | **Active Alerts** | \`{d.get(\"active_alerts\", \"N/A\")}\` |
          | **Symbols Requested** | \`{d.get(\"symbols_requested\", \"N/A\")}\` |
          | **Quotes Obtained** | \`{d.get(\"quotes_obtained\", \"N/A\")}\` |
          | **Alerts Evaluated** | \`{d.get(\"evaluated\", \"N/A\")}\` |
          | **Alerts Triggered** | \`{d.get(\"triggered\", \"N/A\")}\` |
          | **Notifications Created** | \`{d.get(\"notifications_created\", \"N/A\")}\` |
          | **Market Closed Skips** | \`{d.get(\"skipped_market_closed\", \"N/A\")}\` |
          | **Provider Errors** | \`{d.get(\"provider_errors\", \"N/A\")}\` |
          | **Unpriced Symbols** | \`{d.get(\"unpriced_symbols\", [])}\` |
          | **Evaluation Duration** | \`{d.get(\"duration_ms\", \"N/A\")} ms\` |
          '''
              step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if step_summary:
                  with open(step_summary, 'a') as sf:
                      sf.write(summary + '\n')
          except Exception as e:
              print(f'::error::Failed to validate response body: {e}')
              sys.exit(1)
          "
          echo "Alert evaluation completed."

      - name: Upload evaluation evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-evaluation-${{ github.run_id }}
          path: body.json
          retention-days: 14
