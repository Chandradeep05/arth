name: Alert Evaluator

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: alert-evaluator
  cancel-in-progress: false

jobs:
  evaluate-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Evaluate price alerts
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$INTERNAL_JOB_SECRET" ]; then
            echo "::error::BACKEND_URL or INTERNAL_JOB_SECRET secret is not set in GitHub repo secrets"
            exit 1
          fi
          BASE="${BACKEND_URL%/}"

          # Wake the backend first (Render free tier may be asleep; cold start can take ~60s)
          curl -s -o /dev/null --max-time 90 "$BASE/health" || true

          http_code=$(curl -s -o body.json -w "%{http_code}" --max-time 120 \
            -X POST \
            -H "X-Internal-Secret: $INTERNAL_JOB_SECRET" \
            -H "Content-Type: application/json" \
            "$BASE/api/v1/internal/jobs/evaluate-alerts" || echo "000")

          echo "HTTP status: $http_code"
          echo "Response body:"
          cat body.json 2>/dev/null || true
          echo

          # Write structured markdown summary for GitHub Actions UI observability
          if [ -f body.json ]; then
            python3 -c "
          import json, os, sys
          try:
              with open('body.json') as f:
                  d = json.load(f)
              summary = f'''### 📊 Alert Evaluation Evidence (Run: {d.get(\"run_id\", \"N/A\")})
          | Metric | Value |
          |---|---|
          | **Execution Timestamp** | \`{d.get(\"at\", \"N/A\")}\` |
          | **HTTP Status** | \`$http_code\` |
          | **Active Alerts** | \`{d.get(\"active_alerts\", \"N/A\")}\` |
          | **Symbols Requested** | \`{d.get(\"symbols_requested\", \"N/A\")}\` |
          | **Quotes Obtained** | \`{d.get(\"quotes_obtained\", \"N/A\")}\` |
          | **Alerts Evaluated** | \`{d.get(\"evaluated\", \"N/A\")}\` |
          | **Alerts Triggered** | \`{d.get(\"triggered\", \"N/A\")}\` |
          | **Notifications Created** | \`{d.get(\"notifications_created\", \"N/A\")}\` |
          | **Market Closed Skips** | \`{d.get(\"skipped_market_closed\", \"N/A\")}\` |
          | **Provider Errors** | \`{d.get(\"provider_errors\", \"N/A\")}\` |
          | **Unpriced Symbols** | \`{d.get(\"unpriced_symbols\", [])}\` |
          | **Evaluation Duration** | \`{d.get(\"duration_ms\", \"N/A\")} ms\` |
          '''
              step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if step_summary:
                  with open(step_summary, 'a') as sf:
                      sf.write(summary + '\n')
          except Exception as e:
              pass
          " 2>/dev/null || true
          fi

          if [ "$http_code" = "000" ]; then
            echo "::error::Network error -- backend unreachable"
            exit 1
          fi
          if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
            echo "::error::Auth rejected -- INTERNAL_JOB_SECRET in GitHub does not match Render env var"
            exit 1
          fi
          if [ "$http_code" != "200" ]; then
            echo "::error::Unexpected status $http_code"
            exit 1
          fi
          echo "Alert evaluation completed."

      - name: Upload evaluation evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-evaluation-${{ github.run_id }}
          path: body.json
          retention-days: 14
