name: Alert Warmup

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: alert-warmup
  cancel-in-progress: false

jobs:
  warmup-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm up alert symbols
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$INTERNAL_JOB_SECRET" ]; then
            echo "::error::BACKEND_URL or INTERNAL_JOB_SECRET secret is not set in GitHub repo secrets"
            exit 1
          fi
          BASE="${BACKEND_URL%/}"

          # Wake backend first (Render cold start)
          curl -s -o /dev/null --max-time 90 "$BASE/health" || true

          http_code=$(curl -s -o body.json -w "%{http_code}" --max-time 120 \
            -X POST \
            -H "X-Internal-Secret: $INTERNAL_JOB_SECRET" \
            -H "Content-Type: application/json" \
            "$BASE/api/v1/internal/jobs/warm-alert-symbols" || echo "000")

          echo "HTTP status: $http_code"
          echo "Response body:"
          cat body.json 2>/dev/null || true
          echo

          # Write structured markdown summary for GitHub Actions UI observability
          if [ -f body.json ]; then
            python3 -c "
          import json, os, sys
          try:
              with open('body.json') as f:
                  d = json.load(f)
              if d.get('skipped') and ('Redis' in str(d.get('reason', '')) or 'Database' in str(d.get('reason', ''))):
                  summary = f'''### ❌ Warmup Failed (Infrastructure Outage)
          - **Reason:** \`{d.get('reason')}\`
          - **HTTP Status:** \`$http_code\`
          '''
              else:
                  summary = f'''### ⚡ Alert Warmup Evidence
          | Metric | Value |
          |---|---|
          | **HTTP Status** | \`$http_code\` |
          | **Symbols Warmed** | \`{d.get('warmed', 'N/A')}\` |
          | **Symbols Skipped (Cached)** | \`{d.get('skipped', 'N/A')}\` |
          | **Uncached Remaining** | \`{d.get('uncached_remaining', 'N/A')}\` |
          '''
              step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if step_summary:
                  with open(step_summary, 'a') as sf:
                      sf.write(summary + '\n')
          except Exception as e:
              pass
          " 2>/dev/null || true
          fi

          if [ "$http_code" = "000" ]; then
            echo "::error::Network error -- backend unreachable"
            exit 1
          fi
          if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
            echo "::error::Auth rejected -- INTERNAL_JOB_SECRET in GitHub does not match Render env var"
            exit 1
          fi
          if [ "$http_code" != "200" ]; then
            echo "::error::Unexpected status $http_code"
            exit 1
          fi

          # Semantic check: Fail workflow if backend skipped due to missing infrastructure
          if [ -f body.json ]; then
            python3 -c "
          import json, sys
          try:
              d = json.load(open('body.json'))
              if d.get('skipped') and ('Redis' in str(d.get('reason', '')) or 'Database' in str(d.get('reason', ''))):
                  print(f'::error::Warmup failed: {d.get(\"reason\")}')
                  sys.exit(1)
          except Exception as e:
              pass
          "
          fi

          echo "Alert warmup completed."

      - name: Upload warmup evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-warmup-${{ github.run_id }}
          path: body.json
          retention-days: 14
