name: Alert Warmup

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  warmup-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm up alert symbols
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_JOB_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.BACKEND_URL }}/api/v1/internal/jobs/warm-alert-symbols" \
            || echo "000")
          echo "Response: $response"
          if [ "$response" = "000" ]; then
            echo "Network error -- backend unreachable"
            exit 1
          fi
          if [ "$response" != "200" ]; then
            echo "Unexpected status $response"
            exit 1
          fi
          echo "Alert warmup completed."
